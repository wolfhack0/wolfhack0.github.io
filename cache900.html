<!DOCTYPE html>
<html manifest="900.manifest">
<head>
<title>WOLF HACK</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="تحميل الكاش الاوفلاين: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="تم تحميل الكاش الاوفلاين ✔";setTimeout(function(){window.msgs.innerHTML="اتم التحميل الان افلق الانترنت واعد تشغيل المتصفح";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="حدث خطأ اثناء تحميل الكاش احذف الكاش وحاول مرة اخري";};
</script>
<h1 id=msgs style="font-size: 30px;margin-top: 77px;margin-bottom: 455px;">جاري تحميل الكاش الاوفلاين.</h1>
</html>
